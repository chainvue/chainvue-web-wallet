# Build the artifact people download, and attach it to the release.
#
# `release-please.yml` decides the version and writes the changelog; this builds
# the extension and puts the zip and its SHA-256 on the release. Both triggers
# are handled because both happen: merging the release PR publishes a release,
# and a tag pushed by hand should still produce the same artifact.
#
#   npm run bump 0.1.1     # only when tagging by hand; release-please does this
#   git commit -am "release: 0.1.1" && git tag v0.1.1
#   git push && git push --tags
#
# Only first-party actions are used. A pipeline that packages a wallet should
# not have third-party steps that can reach the artifact — see the note in
# release-please.yml about why that one is different.

name: release

on:
  push:
    tags: ['v*']
  # Called by release-please.yml once it has cut a release. This is not a
  # nicety: GitHub does not start a workflow from an event created with the
  # default GITHUB_TOKEN, so the tag and release that release-please publishes
  # wake nothing up. Measured, not assumed — v0.2.0 was cut with zero assets.
  # Calling the build directly sidesteps that without a personal access token,
  # which is the alternative and a worse one to leave lying around a wallet.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # Still fires if a human publishes a release by hand in the web UI.
  release:
    types: [published]
  # Run by hand to prove the build still works. It cannot publish: every step
  # that would is gated on there being a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The toolchain comes from wasm/rust-toolchain.toml; rustup reads it on
      # first use inside that directory. Installed by hand rather than through a
      # third-party action, for the reason in the header.
      - name: Install Rust and wasm-pack
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          rustc --version && wasm-pack --version
        working-directory: wasm

      - run: npm ci

      # `npm run package` refuses to emit a zip if the wasm is missing, if the
      # manifest promises a file that is not staged, or if the two version
      # fields disagree — so a broken release fails here rather than shipping.
      - name: Build the extension
        run: npm run package

      - name: Work out which tag, if any
        id: what
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CALLED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=""
          if [ -n "${CALLED_TAG:-}" ]; then
            tag="$CALLED_TAG"
          elif [ -n "${RELEASE_TAG:-}" ]; then
            tag="$RELEASE_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "zip=$(cd dist && ls *.zip)" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then echo "publishing as $tag"; else echo "no tag — building only"; fi

      # A tag that disagrees with the manifest would publish a version nobody
      # can find again. Checked before anything is uploaded.
      - name: Check the tag matches the manifest
        if: steps.what.outputs.tag != ''
        env:
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          set -euo pipefail
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$manifest" != "${TAG#v}" ]; then
            echo "tag $TAG does not match manifest version $manifest" >&2
            exit 1
          fi
          echo "version $manifest"

      - name: Checksum
        env:
          ZIP: ${{ steps.what.outputs.zip }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            dist/*.zip
            dist/*.sha256

      # Create-or-attach, because either side may get here first: release-please
      # publishes the release with the changelog and this attaches the build,
      # but a hand-pushed tag arrives with no release at all.
      - name: Attach the build to the release
        if: steps.what.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.what.outputs.tag }}
          ZIP: ${{ steps.what.outputs.zip }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release exists — attaching the build"
            gh release upload "$TAG" "dist/$ZIP" "dist/$ZIP.sha256" --clobber
          else
            echo "no release for $TAG — creating one"
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG." \
              "dist/$ZIP" "dist/$ZIP.sha256"
          fi

          # Install instructions belong on the page people land on, but the
          # changelog above them is release-please's and must not be clobbered —
          # so they are appended once, and only when absent.
          body="$(gh release view "$TAG" --json body --jq .body)"
          if printf '%s' "$body" | grep -q '## Install'; then
            echo "install notes already present"
            exit 0
          fi

          printf '%s\n' "$body" > /tmp/notes.md
          cat >> /tmp/notes.md <<'NOTES'

          ## Install

          1. Download the `.zip` below and unzip it.
          2. Open your browser's extensions page — `chrome://extensions`,
             `brave://extensions` or `edge://extensions`.
          3. Turn on **Developer mode**, click **Load unpacked**, and choose the
             folder you just unzipped.

          One download works on macOS, Windows, Linux and ChromeOS: an extension
          is HTML, JavaScript and WebAssembly, none of which is built per
          platform. Needs a Chromium browser 116 or newer — Firefox and Safari
          cannot load it.

          ## Verify it

          ```sh
          sha256sum -c chainvue-web-wallet-*.zip.sha256
          ```

          Built by GitHub Actions from this tag.

          The checksum confirms the file you downloaded is the file this
          workflow published. It is not yet a reproducible-build guarantee:
          rebuilding the same tag reproduces the zip container and every file in
          it except the wasm module, which has been observed to differ by a few
          bytes between otherwise identical CI runs (same commit, same
          `rustc 1.95.0`, same `wasm-pack 0.13.1`, same `Cargo.lock`). The
          suspect is `wasm-opt`. Until that is resolved, treat the checksum as
          integrity for the download, not as proof of provenance.

          ## Before you use it

          This wallet has not been audited. Mainnet is selectable and nothing
          stops you pointing it at real VRSC. Start on VRSCTEST.
          NOTES

          gh release edit "$TAG" --notes-file /tmp/notes.md
