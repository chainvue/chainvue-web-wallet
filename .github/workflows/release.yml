# Build a release the way somebody else can check it.
#
# Push a tag and this produces the extension zip, its SHA-256, and a GitHub
# Release carrying both. The point of doing it here rather than on a laptop is
# that the artifact then comes from a public commit through a process anyone can
# read — for a wallet, that difference is the product.
#
#   npm run bump 0.1.1     # bumps manifest.json and package.json together
#   git commit -am "release: 0.1.1" && git tag v0.1.1
#   git push && git push --tags
#
# Only first-party actions are used. A release pipeline that signs nothing but
# packages a wallet is still worth keeping free of third-party steps that could
# reach the artifact.

name: release

on:
  push:
    tags: ['v*']
  # Run by hand to prove the build still works. It cannot publish: every step
  # that would is gated on the ref being a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The toolchain comes from wasm/rust-toolchain.toml; rustup reads it on
      # first use inside that directory. Installed by hand rather than through a
      # third-party action, for the reason in the header.
      - name: Install Rust and wasm-pack
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          rustc --version && wasm-pack --version
        working-directory: wasm

      - run: npm ci

      # `npm run package` refuses to emit a zip if the wasm is missing, if the
      # manifest promises a file that is not staged, or if the two version
      # fields disagree — so a broken release fails here rather than shipping.
      - name: Build the extension
        run: npm run package

      # A tag that disagrees with the manifest would publish a version nobody
      # can find again. Checked before anything is uploaded.
      - name: Check the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          manifest="$(node -p "require('./manifest.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi
          echo "version $manifest"

      - name: Checksum
        id: sums
        run: |
          set -euo pipefail
          cd dist
          zip="$(ls *.zip)"
          sha256sum "$zip" > "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          cat "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.sums.outputs.zip }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ## Install

          1. Download the `.zip` below and unzip it.
          2. Open your browser's extensions page — `chrome://extensions`,
             `brave://extensions` or `edge://extensions`.
          3. Turn on **Developer mode**, click **Load unpacked**, and choose the
             folder you just unzipped.

          One download works on macOS, Windows, Linux and ChromeOS: an extension
          is HTML, JavaScript and WebAssembly, none of which is built per
          platform.

          Needs a Chromium browser, version 116 or newer. Firefox and Safari
          cannot load it.

          ## Verify it

          ```sh
          sha256sum -c chainvue-web-wallet-*.zip.sha256
          ```

          Built by GitHub Actions from this tag, with the Rust toolchain pinned
          in `wasm/rust-toolchain.toml` and every dependency pinned in
          `wasm/Cargo.lock`, so the same tag rebuilds to the same bytes.

          ## Before you use it

          This wallet has not been audited. Mainnet is selectable and nothing
          stops you pointing it at real VRSC. Start on VRSCTEST.
          NOTES

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "dist/$ZIP" "dist/$ZIP.sha256"
